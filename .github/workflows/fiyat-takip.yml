name: Fiyat takip botu

on:
  schedule:
    - cron: "0 7 * * *" # her gün 07:00 UTC = 10:00 TSİ
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write # veritabanı ve grafikleri commit'leyebilmek için

# Repoya otomatik commit atan tüm workflow'lar aynı sırada bekler, aynı anda push etmez.
concurrency:
  group: otomatik-commit
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 04-fiyat-takip-botu

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 04-fiyat-takip-botu/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testler
        run: pytest -q

      - name: Fiyatları çek ve kontrol et
        env:
          # İsteğe bağlı: repo ayarlarında bu iki secret tanımlıysa uyarılar Telegram'a da gider.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fiyat_takip.py

      - name: Grafikleri güncelle
        run: python grafik.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/fiyatlar.sqlite cikti
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
          else
            git commit -m "Fiyat verisi güncellendi ($(TZ=Europe/Istanbul date +%d.%m.%Y))"
            git pull --rebase
            git push
          fi
